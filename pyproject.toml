[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-watch"
version = "0.1.0"
description = "Business Development Watch + Outreach Drafter"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "ddgs>=6.0.0",
    "playwright>=1.44.0",
    "feedparser>=6.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
bd-watch = "bd_watch.pipeline:main"

# Dev tooling. Installed by default with `uv sync` (PEP 735 dependency group).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
