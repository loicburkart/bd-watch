# BD Watch — Nominations Module Configuration
# Option B: broad queries + post-fetch filtering on target roles

lookback_hours: 1440  # 60 days — overridable via RSS_LOOKBACK_HOURS env var or --lookback CLI arg

# ------------------------------------------------------------------
# Google News RSS queries
# Broad to maximize volume; roles are filtered post-fetch.
# Format fetched: https://news.google.com/rss/search?q={query}&hl=fr&gl=FR&ceid=FR:fr
# ------------------------------------------------------------------
rss_queries:
  # French — broad
  - "nomination directeur France"
  - "nommé directeur France"
  - "prend la direction France"
  - "rejoint en tant que France"
  # French — C-suite acronyms
  - "nommé CDO France"
  - "nommé CTO France"
  - "nommé CMO France"
  - "nommé CFO France"
  - "nommé COO France"
  - "nommé DG France"
  - "nomination PDG France"
  - "nommé DSI France"
  - "nommé DRH France"
  # French — fonctions / intitulés de poste
  - "nommé directeur marketing France"
  - "nommé directeur supply chain France"
  - "nommé directeur commercial France"
  - "nommé directeur de la stratégie France"
  # French — data / IA / transformation
  - "nommé Chief Data Officer France"
  - "nommé directeur data France"
  - "nommé directeur intelligence artificielle France"
  - "nommé Head of Data France"
  - "nommé directeur de la transformation France"
  # English — for NORAM / North East Asia coverage
  - "appointed Chief Digital Officer"
  - "appointed Chief Technology Officer"
  - "appointed Chief Marketing Officer"
  - "appointed Chief Financial Officer"
  - "appointed Chief Data Officer"
  - "appointed Chief AI Officer"
  - "named CEO France"
  - "appointed director France"

# ------------------------------------------------------------------
# Direct RSS sources
# Set enabled: false to skip until URL is verified
# ------------------------------------------------------------------
direct_rss_sources:
  - name: "Actusnews - Communiqués"
    url: "https://www.actusnews.com/news-rss/"
    enabled: true
  - name: "Les Echos - Nominations"
    url: "https://www.lesechos.fr/rss/rss_nominations.xml"
    enabled: false  # TBD — verify with: curl -I https://www.lesechos.fr/rss/rss_nominations.xml
  - name: "Le Figaro - Nominations"
    url: "https://www.lefigaro.fr/rss/figaro_nominations.xml"
    enabled: false  # TBD — verify before enabling

# ------------------------------------------------------------------
# Target roles — post-fetch filter
# An entry must match at least one role (or a nomination pattern) to be kept.
# ------------------------------------------------------------------
target_roles:
  c_suite:
    - CDO
    - CTO
    - CMO
    - CFO
    - COO
    - CHRO
    - CSO
    - CEO
    - CSCO
    - CIO
    - CCO
  french_acronyms:
    - DG
    - PDG
    - DSI
    - DRH
    - DAF
    - DGA
  seniority:
    - VP
    - SVP
    - EVP
    - "Operating Partner"
    - "Managing Director"
  function_directors:
    - "directeur marketing"
    - "directeur supply chain"
    - "directeur logistique"
    - "directeur financier"
    - "directeur commercial"
    - "directeur des opérations"
    - "directeur innovation"
    - "directeur digital"
    - "directeur des systèmes d'information"
    - "directeur stratégie"
    - "directeur des ressources humaines"
    - "directeur général"
    - "vice-président"
    - "vice président"

# ------------------------------------------------------------------
# Nomination detection patterns (applied to article title + description)
# A match here OR a role match is required to keep an entry.
# ------------------------------------------------------------------
nomination_patterns_fr:
  - "nommé"
  - "nomination"
  - "prend la direction"
  - "rejoint"
  - "intègre"
  - "est promu"
  - "prend ses fonctions"
  - "nouvellement nommé"
  - "vient d'être nommé"
  - "a rejoint"

nomination_patterns_en:
  - "appointed"
  - "named"
  - "joins as"
  - "promoted to"
  - "takes over as"
  - "steps up as"
  - "new appointment"

# ------------------------------------------------------------------
# Target sectors — for scoring (P1 = max priority)
# ------------------------------------------------------------------
target_sectors:
  P1:
    - food
    - agroalimentaire
    - agro-alimentaire
    - alimentation
    - fmcg
    - cpg
    - "grande consommation"
    - boissons
    - "food & beverage"
  P2:
    - retail
    - distribution
    - "grande distribution"
    - luxe
    - luxury
    - beauté
    - cosmétiques
    - santé
    - healthcare
    - pharma
    - pharmaceutique

